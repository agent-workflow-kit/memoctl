# Example config for memoctl.
# Location: .config/memoctl/config.yaml under your home directory (from the password database;
# HOME and XDG_* are not read, and there is no --config). Drop-ins: config.d/*.yaml beside it.
# Every key is documented in docs/interface.md (Config). Values shown are the defaults.

# Name of the environment variable that holds the claimed author kind of a note.
kind_env: CSESSION_KIND

# Names of environment variables whose current values `add` refuses to store (at most 32).
mask_env: []

retention:
  max_age: 30d            # default lifetime of a note and the cap on --expires

limits:
  max_body_bytes: 8192    # 256 to 65536
  max_labels: 8           # 0 to 32
  live_per_repo: 200
  total: 5000
  adds_per_window: 20
  adds_per_window_total: 60   # whole store, at least adds_per_window
  window: 10m

context:
  # Allow list: only notes whose claimed author kind is listed reach `context`.
  # `unknown` and user-defined kinds are excluded until you add them.
  author_kinds: [implement, draft-ticket, audit, improve]
  max_chars: 8000         # UTF-16 code units, whole notes only
  max_bytes: 15000
  max_notes: 20
  max_per_topic: 2
  max_kind_share: 0.5     # of max_chars and of max_notes, in the first pass
  note_max_chars: 2000
  deadline: 2s            # global only

# Per-repo overrides, keyed by exact repo id (host/path). Allowed keys only:
# retention.max_age; limits.max_body_bytes, max_labels, live_per_repo, adds_per_window;
# context.author_kinds, max_chars, max_bytes, max_notes, max_per_topic, max_kind_share, note_max_chars.
repos: {}
